<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escáner de zonas de compra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #e8e0d0;
        --mute: #8d8678;
        --carbon: #101218;
        --panel: #171a22;
        --rule: #2c3140;
        --gold: #d4b46a;
        --gold-dim: rgba(212, 180, 106, 0.14);
        --wait: #7d8b97;
        --inv: #c45c4a;
        --inv-dim: rgba(196, 92, 74, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--carbon);
        color: var(--ink);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }

      body {
        padding: 28px 20px 48px;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px 24px;
        align-items: end;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .lede {
        margin: 8px 0 0;
        color: var(--mute);
        font-size: 12px;
        line-height: 1.55;
        max-width: 62ch;
      }

      .actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      button {
        appearance: none;
        border: 1px solid var(--gold);
        background: transparent;
        color: var(--gold);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 12px 18px;
        cursor: pointer;
      }

      button:hover {
        background: var(--gold);
        color: var(--carbon);
      }

      button:disabled {
        opacity: 0.45;
        cursor: wait;
      }

      .stamp {
        color: var(--mute);
        font-size: 11px;
      }

      .tally {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--rule);
        border: 1px solid var(--rule);
        margin: 20px 0 0;
      }

      .tally div {
        background: var(--panel);
        padding: 14px 16px;
      }

      .tally span {
        display: block;
        color: var(--mute);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .tally strong {
        font-size: 22px;
        font-weight: 500;
      }

      .tally .buy-count {
        color: var(--gold);
      }

      .list {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      article {
        background: var(--panel);
        border: 1px solid var(--rule);
        padding: 14px 16px 16px;
      }

      article.buy {
        border-color: var(--gold);
        background: linear-gradient(180deg, var(--gold-dim), var(--panel) 48%);
      }

      article.dead {
        border-color: #5a332c;
        background: var(--inv-dim);
      }

      .row {
        display: grid;
        grid-template-columns: 88px 1fr 120px 160px;
        gap: 12px;
        align-items: baseline;
      }

      .ticker {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .spot {
        font-size: 15px;
      }

      .badge {
        justify-self: end;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      article.buy .badge {
        color: var(--gold);
      }

      article.wait .badge {
        color: var(--wait);
      }

      article.dead .badge {
        color: var(--inv);
      }

      .fill {
        justify-self: end;
        font-size: 13px;
        font-weight: 500;
      }

      article.buy .fill {
        color: var(--gold);
      }

      .detail {
        margin: 10px 0 0;
        color: var(--mute);
        font-size: 12px;
        line-height: 1.5;
      }

      .ladder {
        margin-top: 12px;
        display: grid;
        gap: 6px;
      }

      .step {
        display: grid;
        grid-template-columns: 72px 1fr 88px;
        gap: 10px;
        align-items: center;
        font-size: 11px;
        color: var(--mute);
      }

      .bar {
        height: 6px;
        background: #222632;
        position: relative;
      }

      .step.active .bar {
        outline: 1px solid var(--gold);
      }

      .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 2px;
        background: var(--ink);
      }

      .err {
        margin-top: 16px;
        color: var(--inv);
        font-size: 12px;
      }

      @media (max-width: 800px) {
        header,
        .row,
        .tally {
          grid-template-columns: 1fr;
        }

        .actions,
        .badge,
        .fill {
          justify-self: start;
          align-items: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Escáner de zonas de compra</h1>
          <p class="lede">
            Precio spot Binance USDT. Zonas del plan semanal 2026–2029. El %
            es sobre lo que vas a meter en ese token, no del portfolio. No es
            asesoramiento financiero.
          </p>
        </div>
        <div class="actions">
          <button id="scan" type="button">Escanear ahora</button>
          <div class="stamp" id="stamp">Sin datos</div>
        </div>
      </header>
      <section class="tally" aria-live="polite">
        <div>
          <span>En compra</span>
          <strong class="buy-count" id="nBuy">—</strong>
        </div>
        <div>
          <span>Esperar</span>
          <strong id="nWait">—</strong>
        </div>
        <div>
          <span>Invalidado</span>
          <strong id="nDead">—</strong>
        </div>
      </section>
      <div class="list" id="list"></div>
      <p class="err" id="err" hidden></p>
    </main>
    <script>
      const TOKENS = [
        {
          ticker: "ADA",
          symbol: "ADAUSDT",
          digits: 4,
          invalidation: 0.13,
          zones: [
            { label: "Zona 1", low: 0.2, high: 0.215, pct: 40 },
            { label: "Zona 2", low: 0.138, high: 0.16, pct: 60 },
          ],
        },
        {
          ticker: "RAY",
          symbol: "RAYUSDT",
          digits: 3,
          invalidation: null,
          zones: [{ label: "Zona 1", low: 1.1, high: 1.25, pct: 70 }],
        },
        {
          ticker: "ARB",
          symbol: "ARBUSDT",
          digits: 4,
          invalidation: 0.07,
          zones: [{ label: "Zona 1", low: 0.09, high: 0.11, pct: 70 }],
        },
        {
          ticker: "TAO",
          symbol: "TAOUSDT",
          digits: 1,
          invalidation: null,
          zones: [{ label: "Zona 1", low: 180, high: 200, pct: 70 }],
        },
        {
          ticker: "HBAR",
          symbol: "HBARUSDT",
          digits: 5,
          invalidation: null,
          zones: [{ label: "Zona 1", low: 0.055, high: 0.062, pct: 70 }],
        },
        {
          ticker: "ASTER",
          symbol: "ASTERUSDT",
          digits: 3,
          invalidation: 0.39,
          zones: [
            { label: "Zona 1", low: 0.585, high: 0.62, pct: 30 },
            { label: "Zona 2", low: 0.507, high: 0.507, pct: 40 },
            { label: "Zona 3", low: 0.403, high: 0.403, pct: 30 },
          ],
        },
        {
          ticker: "AAVE",
          symbol: "AAVEUSDT",
          digits: 2,
          invalidation: 70,
          zones: [{ label: "Zona 1", low: 90, high: 110, pct: 70 }],
        },
        {
          ticker: "ONDO",
          symbol: "ONDOUSDT",
          digits: 3,
          invalidation: 0.2,
          zones: [
            { label: "Zona 1", low: 0.32, high: 0.335, pct: 40 },
            { label: "Zona 2", low: 0.29, high: 0.3, pct: 60 },
          ],
        },
        {
          ticker: "UNI",
          symbol: "UNIUSDT",
          digits: 3,
          invalidation: 3.8,
          zones: [{ label: "Zona 1", low: 4.8, high: 5.2, pct: 70 }],
        },
        {
          ticker: "ENA",
          symbol: "ENAUSDT",
          digits: 4,
          invalidation: 0.065,
          zones: [
            { label: "Starter", low: 0.138, high: 0.145, pct: 30 },
            { label: "Zona 2", low: 0.08, high: 0.09, pct: 40 },
            { label: "Zona 3", low: 0.07, high: 0.07, pct: 30 },
          ],
        },
        {
          ticker: "JUP",
          symbol: "JUPUSDT",
          digits: 4,
          invalidation: 0.135,
          zones: [
            { label: "Zona 1", low: 0.2, high: 0.22, pct: 40 },
            { label: "Zona 2", low: 0.16, high: 0.17, pct: 60 },
          ],
        },
        {
          ticker: "AVAX",
          symbol: "AVAXUSDT",
          digits: 3,
          invalidation: 5.5,
          zones: [
            { label: "Starter", low: 7.0, high: 7.5, pct: 30 },
            { label: "Zona 2", low: 6.1, high: 6.1, pct: 40 },
            { label: "Zona 3", low: 5.68, high: 5.68, pct: 30 },
          ],
        },
        {
          ticker: "LINK",
          symbol: "LINKUSDT",
          digits: 3,
          invalidation: 6.9,
          zones: [
            { label: "Zona 1", low: 11.0, high: 11.3, pct: 40 },
            { label: "Zona 2", low: 9.5, high: 10.3, pct: 60 },
          ],
        },
      ];

      const POINT_PAD = 0.004;

      function fmt(n, digits) {
        return n.toLocaleString("es-AR", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits,
        });
      }

      function dropPct(spot, target) {
        return ((spot - target) / spot) * 100;
      }

      function inBand(spot, zone) {
        const pad = zone.low === zone.high ? Math.max(zone.low * POINT_PAD, 1e-8) : 0;
        return spot >= zone.low - pad && spot <= zone.high + pad;
      }

      function evaluate(token, spot) {
        const zones = token.zones;
        if (token.invalidation != null && spot < token.invalidation) {
          return {
            status: "dead",
            badge: "Invalidado",
            fill: "0%",
            detail:
              "Cierre de tesis. Spot " +
              fmt(spot, token.digits) +
              " debajo de " +
              fmt(token.invalidation, token.digits) +
              ". No promediar.",
            needle: spot,
          };
        }

        for (const zone of zones) {
          if (inBand(spot, zone)) {
            return {
              status: "buy",
              badge: "Compra",
              fill: "Comprar " + zone.pct + "%",
              detail:
                zone.label +
                " " +
                fmt(zone.low, token.digits) +
                (zone.low === zone.high ? "" : "–" + fmt(zone.high, token.digits)) +
                ". Solo ese tramo. El resto espera más abajo.",
              active: zone,
              needle: spot,
            };
          }
        }

        const next = zones.find((zone) => spot > zone.high);
        if (next) {
          const lack = dropPct(spot, next.high);
          return {
            status: "wait",
            badge: "Esperar",
            fill: "Falta −" + lack.toFixed(1) + "%",
            detail:
              "No está en zona. Próxima: " +
              next.label +
              " " +
              fmt(next.low, token.digits) +
              (next.low === next.high ? "" : "–" + fmt(next.high, token.digits)) +
              " (" +
              next.pct +
              "%). Limit, no perseguir.",
            needle: spot,
          };
        }

        const floor = zones[zones.length - 1];
        return {
          status: "wait",
          badge: "Debajo",
          fill: "0% ahora",
          detail:
            "Perforó " +
            fmt(floor.low, token.digits) +
            " sin llegar a invalidación. No cazar. Esperar retest o cierre semanal.",
          needle: spot,
        };
      }

      function needleLeft(token, spot) {
        const last = token.zones[token.zones.length - 1];
        const first = token.zones[0];
        const min = Math.min(last.low, token.invalidation ?? last.low) * 0.97;
        const max = Math.max(first.high, spot) * 1.04;
        const t = (spot - min) / (max - min);
        return Math.min(100, Math.max(0, t * 100));
      }

      function render(rows) {
        const list = document.getElementById("list");
        list.replaceChildren();
        let nBuy = 0;
        let nWait = 0;
        let nDead = 0;

        for (const row of rows) {
          if (row.status === "buy") nBuy += 1;
          else if (row.status === "dead") nDead += 1;
          else nWait += 1;

          const article = document.createElement("article");
          article.className = row.status === "buy" ? "buy" : row.status === "dead" ? "dead" : "wait";

          const top = document.createElement("div");
          top.className = "row";
          top.innerHTML =
            '<div class="ticker">' +
            row.ticker +
            '</div><div class="spot">' +
            fmt(row.spot, row.digits) +
            ' USDT</div><div class="badge">' +
            row.badge +
            '</div><div class="fill">' +
            row.fill +
            "</div>";

          const detail = document.createElement("p");
          detail.className = "detail";
          detail.textContent = row.detail;

          const ladder = document.createElement("div");
          ladder.className = "ladder";
          const left = needleLeft(row.token, row.spot);
          for (const zone of row.token.zones) {
            const step = document.createElement("div");
            step.className = "step" + (row.active === zone ? " active" : "");
            const range =
              zone.low === zone.high
                ? fmt(zone.low, row.digits)
                : fmt(zone.low, row.digits) + "–" + fmt(zone.high, row.digits);
            step.innerHTML =
              "<span>" +
              zone.label +
              '</span><span class="bar"><i style="left:' +
              left.toFixed(2) +
              '%"></i></span><span>' +
              range +
              " · " +
              zone.pct +
              "%</span>";
            ladder.append(step);
          }

          article.append(top, detail, ladder);
          list.append(article);
        }

        document.getElementById("nBuy").textContent = String(nBuy);
        document.getElementById("nWait").textContent = String(nWait);
        document.getElementById("nDead").textContent = String(nDead);
      }

      async function scan() {
        const btn = document.getElementById("scan");
        const err = document.getElementById("err");
        err.hidden = true;
        btn.disabled = true;
        try {
          const symbols = TOKENS.map((t) => t.symbol);
          const url =
            "https://api.binance.com/api/v3/ticker/price?symbols=" +
            encodeURIComponent(JSON.stringify(symbols));
          const res = await fetch(url);
          if (!res.ok) throw new Error("Binance " + res.status);
          const data = await res.json();
          const bySymbol = {};
          for (const item of data) bySymbol[item.symbol] = Number(item.price);

          const rows = TOKENS.map((token) => {
            const spot = bySymbol[token.symbol];
            if (!Number.isFinite(spot)) {
              return {
                ...evaluate(token, NaN),
                ticker: token.ticker,
                spot: 0,
                digits: token.digits,
                token,
                status: "wait",
                badge: "Sin precio",
                fill: "—",
                detail: "Binance no devolvió " + token.symbol,
              };
            }
            return { ticker: token.ticker, spot, digits: token.digits, token, ...evaluate(token, spot) };
          });

          rows.sort((a, b) => {
            const rank = { buy: 0, wait: 1, dead: 2 };
            return (rank[a.status] ?? 9) - (rank[b.status] ?? 9);
          });
          render(rows);
          document.getElementById("stamp").textContent =
            "Binance " +
            new Date().toLocaleString("es-AR", {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
        } catch (e) {
          err.hidden = false;
          err.textContent =
            "No pude leer Binance (" +
            (e && e.message ? e.message : "red") +
            "). Abrí el archivo con un servidor local o escribime «compará» en el chat.";
        } finally {
          btn.disabled = false;
        }
      }

      document.getElementById("scan").addEventListener("click", scan);
      scan();
    </script>
  </body>
</html>
